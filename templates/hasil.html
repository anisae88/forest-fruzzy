<!DOCTYPE html>
<html>
<head>
    <title>Hasil Analisis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Hasil Analisis Bukaan Hutan</h3>
        </div>

        <div class="card-body">
            

            {% for r in results %}

            <div class="card mb-4">

                <div class="card-body">

                    <h4>{{ r.filename }}</h4>

                    <p>
                        <b>Persentase Hutan :</b>
                        {{ r.percentage }} %
                    </p>

                    <p>
                        <b>Kategori :</b>
                        {{ r.category }}
                    </p>

                    <p>
                        <b>Defuzzifikasi :</b>
                        {{ r.defuzz }}
                    </p>

                    <pre>{{ r.calculation }}</pre>

                    <img src="{{ url_for('static', filename=r.chart) }}"
                         class="img-fluid">

                </div>
            </div>

            {% endfor %}
<h4 class="mb-3">
                Grafik Persentase Bukaan Hutan
            </h4>

        <img src="{{ url_for('static', filename=summary_chart) }}"
        class="img-fluid mb-5">
            <a href="/" class="btn btn-secondary">
                Kembali
            </a>

        </div>

    </div>

</div>

</body>
</html>
