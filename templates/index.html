<!DOCTYPE html>
<html>
<head>
    <title>Analisis Bukaan Hutan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Analisis Bukaan Hutan dengan Fuzzy</h3>
        </div>

        <div class="card-body">

            <h5>Grafik Rule Fuzzy</h5>

            <img src="{{ url_for('static', filename='charts/rule_graph.png') }}"
                 class="img-fluid mb-4">

            <form action="/analyze" method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label>Upload 3 Gambar Hutan</label>

                    <input type="file"
                           class="form-control"
                           name="images"
                           multiple
                           required>
                </div>

                <button class="btn btn-success">
                    Analisis Sekarang
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
